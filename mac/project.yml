# Generates PrivateMeetingAssistant.xcodeproj. After editing, run: xcodegen generate
name: PrivateMeetingAssistant
# Debug and Release are the Developer ID builds (notarized DMG, scripts/release.sh). AppStore is the
# sandboxed Mac App Store build (scripts/release-appstore.sh): no downloaded Ollama, meetings folder
# kept with a bookmark, signed for the App Store.
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  # Downloads the pinned whisper.cpp framework into Vendor/ if it isn't there yet.
  preGenCommand: scripts/fetch-whisper.sh
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SpeexDSP:
    path: Vendor/SpeexDSP
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The version people see; describe each one in CHANGELOG.md (the release scripts check).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7X36HVTXYB
targets:
  PrivateMeetingAssistant:
    type: application
    platform: macOS
    sources: [PrivateMeetingAssistant]
    dependencies:
      # whisper.cpp with Metal: speech to text on this Mac's GPU.
      - framework: Vendor/whisper.framework
        embed: true
      - package: SpeexDSP
      - package: GRDB
        product: GRDB
    configFiles:
      # OAuth client IDs for signing in to Google, Microsoft and Zoom (see OAUTH.md).
      Debug: Config/OAuth.xcconfig
      Release: Config/OAuth.xcconfig
    info:
      path: PrivateMeetingAssistant/Info.plist
      properties:
        PMAGoogleClientID: $(PMA_GOOGLE_CLIENT_ID)
        PMAGoogleClientSecret: $(PMA_GOOGLE_CLIENT_SECRET)
        PMAMicrosoftClientID: $(PMA_MICROSOFT_CLIENT_ID)
        PMAZoomClientID: $(PMA_ZOOM_CLIENT_ID)
        PMAZoomClientSecret: $(PMA_ZOOM_CLIENT_SECRET)
        CFBundleDisplayName: Private Meeting Assistant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Private Meeting Assistant transcribes what you say in meetings. Audio never leaves this Mac.
        NSDocumentsFolderUsageDescription: Private Meeting Assistant saves meetings in the folder you chose, which is in your Documents folder.
        NSAudioCaptureUsageDescription: Private Meeting Assistant transcribes the other participants in your calls. Audio never leaves this Mac.
        NSHumanReadableCopyright: Copyright © 2026 Ruy Delgado. MIT License.
        # Only standard HTTPS: no export compliance documents needed.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Private Meeting Assistant
        # Same identifier as the Tauri prototype, so permissions and data carry over.
        PRODUCT_BUNDLE_IDENTIFIER: dev.ruy.private-meeting-assistant
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # One stable identity for every build keeps macOS privacy permissions across rebuilds.
        CODE_SIGN_IDENTITY: Developer ID Application
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Developer ID: Hardened Runtime only (the microphone entitlement, without which it blocks
        # microphone input silently).
        CODE_SIGN_ENTITLEMENTS: PrivateMeetingAssistant/PrivateMeetingAssistant.entitlements
      configs:
        AppStore:
          # The App Sandbox and what it lets the app reach.
          CODE_SIGN_ENTITLEMENTS: PrivateMeetingAssistant/AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
    scheme:
      testTargets: [PrivateMeetingAssistantTests]
  PrivateMeetingAssistantTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PrivateMeetingAssistantTests]
    dependencies:
      - target: PrivateMeetingAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ruy.private-meeting-assistant.tests
        # The app's whisper module, found when compiling the tests; the app itself provides it at run time.
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Vendor
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Private Meeting Assistant.app/Contents/MacOS/Private Meeting Assistant
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        # The host app uses Hardened Runtime, which only loads code signed by the same team.
        CODE_SIGN_IDENTITY: Developer ID Application
