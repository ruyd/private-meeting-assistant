[package]
name = "private-meeting-assistant"
version = "0.1.0"
description = "Fully local meeting transcription, summaries and archive"
edition = "2021"

[lib]
name = "pma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures-util = "0.3"
cpal = "0.18"
rubato = "5"
hound = "3.5"
crossbeam-channel = "0.5"
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"
